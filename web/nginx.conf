# nginx của bản thật: phục vụ giao diện (dist/) và chuyển /api sang backend.
# Chứng chỉ HTTPS gắn vào /etc/nginx/certs (xem docker-compose.prod.yml):
#   fullchain.pem (chứng chỉ) · privkey.pem (khóa riêng)

# HTTP: chuyển hết sang HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Một tệp tải lên tối đa 200MB (backend tự kiểm), một lần nộp có thể kèm nhiều tệp
    client_max_body_size 1g;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/... → backend. Giữ nguyên đường dẫn (backend cũng có tiền tố /api).
    # Gọi bằng tên service "api" trong docker-compose.prod.yml, không dùng 127.0.0.1
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tệp lớn: đẩy thẳng sang backend, không chờ nhận hết; xuất Word / Excel có thể lâu
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    root /usr/share/nginx/html;

    # Tệp tĩnh do Vite build (tên có mã băm): cho trình duyệt giữ lâu
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html: luôn hỏi lại, để bản mới có hiệu lực ngay
    location = /index.html {
        expires -1;
    }

    # Các trang con của SPA (vd /forms/123): không có tệp thì trả index.html, React Router lo phần còn lại
    location / {
        try_files $uri $uri/ /index.html;
    }
}
