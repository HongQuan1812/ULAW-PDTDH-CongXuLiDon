# Bản thật: ba container, chỉ nginx mở cổng ra ngoài.
#   Trình duyệt ──HTTPS──▶ nginx (80/443) ──/api──▶ api (3000) ──▶ postgres (5432)
#
# Cần trước khi chạy:
#   - .env ở thư mục gốc (chép từ .env.example): tài khoản PostgreSQL, cổng, thư mục chứng chỉ
#   - api/.env (chép từ api/.env.example): biến của backend. DATABASE_URL, UPLOAD_DIR, API_PORT trong tệp này
#     bị bỏ qua, compose tự đặt bên dưới cho khớp với các container
#   - chứng chỉ HTTPS: fullchain.pem + privkey.pem trong TLS_CERT_DIR
#     (thử trên máy mình: sh docker/nginx/make-dev-cert.sh tạo chứng chỉ tự kí)
#
# Lệnh:
#   docker compose -f docker-compose.prod.yml up -d --build                     # build và chạy
#   docker compose -f docker-compose.prod.yml run --rm api pnpm exec prisma migrate deploy   # tạo / cập nhật bảng
#   docker compose -f docker-compose.prod.yml logs -f api                       # xem log backend
#   docker compose -f docker-compose.prod.yml down                              # dừng (dữ liệu vẫn còn)
#   KHÔNG dùng "down -v": xóa luôn volume, mất hết dữ liệu và tệp tải lên

# Tên riêng, để không dùng chung container và volume với docker-compose.yml (môi trường phát triển)
name: cong-xu-li-don-prod

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    # Không mở cổng ra ngoài: chỉ api gọi tới, qua mạng nội bộ của compose
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-cong-xu-li-don-api:local}
    restart: unless-stopped
    env_file: api/.env
    # Ghi đè api/.env: các giá trị này phụ thuộc cách container nối với nhau, không phụ thuộc máy
    # (mật khẩu có kí tự đặc biệt như @ : / thì phải mã hoá URL, hoặc chỉ dùng chữ và số)
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}?schema=public
      UPLOAD_DIR: /app/api/uploads
      API_PORT: 3000
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${WEB_IMAGE:-cong-xu-li-don-web:local}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Dữ liệu PostgreSQL
  postgres-data:
  # Tệp tải lên (UPLOAD_DIR)
  uploads:
