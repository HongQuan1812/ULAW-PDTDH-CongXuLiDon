# Bản thật: ba container, chỉ nginx mở cổng ra ngoài.
#   Trình duyệt ──HTTPS──▶ nginx (80/443) ──/api──▶ api (3000) ──▶ postgres (5432)
#
# Cần trước khi chạy:
#   - .env.prod ở thư mục gốc (chép từ .env.prod.example): tài khoản PostgreSQL, cổng, chứng chỉ, biến của backend.
#     DATABASE_URL, UPLOAD_DIR, API_PORT do compose tự đặt bên dưới cho khớp với các container
#   - chứng chỉ HTTPS: fullchain.pem + privkey.pem trong TLS_CERT_DIR
#     (thử trên máy mình: sh docker/nginx/make-dev-cert.sh tạo chứng chỉ tự kí)
#
# Lệnh:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build                     # build và chạy
#     (mỗi lần bật / restart api tự chạy: migrate deploy → seed:production với FIRST_ADMIN_EMAIL → backend, không xóa gì)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f api                       # xem log backend
#   docker compose -f docker-compose.prod.yml --env-file .env.prod down                              # dừng (dữ liệu vẫn còn)
#   KHÔNG dùng "down -v" (pnpm prod:wipe) trên máy chủ thật: xóa luôn volume, mất hết dữ liệu và tệp tải lên (chỉ để thử trên máy mình)
#
# Image: chạy tay thì build tại máy, tên ulaw-cong-xu-li-don-api:prod / -web:prod.
# CI/CD (docker/deploy.sh) đặt API_IMAGE, WEB_IMAGE = image trên GHCR theo commit, kéo về rồi up --no-build.

# Tên đặt theo ulaw-cong-xu-li-don-<môi trường>-<phần>, để không lẫn với docker-compose.dev.yml và dự án khác
name: ulaw-cong-xu-li-don-prod

services:
  postgres:
    image: postgres:18.6
    container_name: ulaw-cong-xu-li-don-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      # User dự án không được tạo database (chỉ cần khi chạy "prisma migrate dev" lúc phát triển)
      APP_DB_CREATEDB: 'false'
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    # Không mở cổng ra ngoài: chỉ api gọi tới, qua mạng nội bộ của compose
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-ulaw-cong-xu-li-don-api:prod}
    container_name: ulaw-cong-xu-li-don-prod-api
    restart: unless-stopped
    env_file: .env.prod
    # Ghi đè .env.prod: các giá trị này phụ thuộc cách container nối với nhau, không phụ thuộc máy
    # (mật khẩu có kí tự đặc biệt như @ : / thì phải mã hoá URL, hoặc chỉ dùng chữ và số)
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}?schema=public
      UPLOAD_DIR: /app/api/uploads
      BACKUP_DIR: /app/api/backups
      API_PORT: 3000
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/api/uploads
      # Nơi lưu kiểu "Thư mục trên máy chủ" của trang Sao lưu; máy chủ thật có thể gắn ổ thứ hai, vd /mnt/sao-luu:/app/api/backups
      - backups:/app/api/backups
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${WEB_IMAGE:-ulaw-cong-xu-li-don-web:prod}
    container_name: ulaw-cong-xu-li-don-prod-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Dữ liệu PostgreSQL
  postgres-data:
  # Tệp tải lên (UPLOAD_DIR)
  uploads:
  # Bản sao lưu (BACKUP_DIR)
  backups:
